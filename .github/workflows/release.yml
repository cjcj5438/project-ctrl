name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          # Cargo.toml 只认文件顶部 [package] 段内的 version 行（dependencies 里的
          # version 键在后面的 [...] 段里，不会被取到；比 sed|head -1 严格）
          crate="$(node -e "
            const fs = require('fs');
            const text = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
            const seg = text.split(/^\[.*\]/m)[1] ?? '';
            const m = seg.match(/^version\s*=\s*\"([^\"]+)\"/m);
            if (!m) { console.error('Cargo.toml [package] 段未找到 version'); process.exit(1); }
            console.log(m[1]);
          ")"
          conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "tag=$tag  package.json=$pkg  Cargo.toml=$crate  tauri.conf.json=$conf"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$crate" ] || [ "$tag" != "$conf" ]; then
            echo "::error::版本不一致：tag=$tag, package.json=$pkg, Cargo.toml=$crate, tauri.conf.json=$conf（请先同步三处版本再打 tag）"
            exit 1
          fi

      - name: Build frontend
        run: pnpm build

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'project-ctrl ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          args: --bundles app
